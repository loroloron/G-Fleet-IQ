{% extends "dashboard/base.html" %}
{% load i18n %}

{% block content %}

<h1 class="mb-4">🗑️ {% translate "Delete Load" %}</h1>

<div class="card shadow">

    <div class="card-body">

        <p>
            {% translate "Are you sure you want to delete this load for" %}
            <strong>{{ load.customer }}</strong>?
        </p>

        <form method="POST">

            {% csrf_token %}

            <button type="submit" class="btn btn-danger">
                🗑️ {% translate "Delete Load" %}
            </button>

            <a href="{% url 'loads' %}" class="btn btn-secondary">
                {% translate "Cancel" %}
            </a>

        </form>

    </div>

</div>

{% endblock %}
