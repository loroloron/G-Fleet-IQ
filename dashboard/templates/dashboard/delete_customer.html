{% extends "dashboard/base.html" %}
{% load i18n %}

{% block content %}

<h1 class="mb-4">🗑️ {% translate "Delete Customer" %}</h1>

<div class="card shadow">
    <div class="card-body">

        <p>
            {% translate "Are you sure you want to delete" %}
            <strong>{{ customer.name }}</strong>?
        </p>

        <form method="POST">
            {% csrf_token %}

            <button type="submit" class="btn btn-danger">
                🗑️ {% translate "Delete Customer" %}
            </button>

            <a href="{% url 'customers' %}" class="btn btn-secondary">
                {% translate "Cancel" %}
            </a>

        </form>

    </div>
</div>

{% endblock %}
