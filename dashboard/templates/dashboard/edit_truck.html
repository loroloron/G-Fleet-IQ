{% extends "dashboard/base.html" %}
{% load i18n %}

{% block content %}

<h1 class="mb-4">🚛 {% translate "Edit Truck" %}</h1>

<div class="card shadow">
    <div class="card-body">

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn btn-success">
                💾 {% translate "Save Changes" %}
            </button>

            <a href="/trucks/" class="btn btn-secondary">
                {% translate "Cancel" %}
            </a>

        </form>

    </div>
</div>

{% endblock %}
