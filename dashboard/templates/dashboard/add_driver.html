{% extends "dashboard/base.html" %}
{% load i18n %}

{% block content %}

<h1 class="mb-4">👤 {% translate "Add Driver" %}</h1>

<div class="card shadow">

    <div class="card-header bg-primary text-white">
        ➕ New Driver
    </div>

    <div class="card-body">

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn btn-primary">
                💾 {% translate "Save Driver" %}
            </button>

            <a href="{% url 'drivers' %}" class="btn btn-secondary">
                ← {% translate "Back to Drivers" %}
            </a>

        </form>

    </div>

</div>

{% endblock %}
